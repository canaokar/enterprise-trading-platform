AWSTemplateFormatVersion: '2010-09-09'
Description: Student AWS resources. After this stack completes, run the assigned Jenkins job to deploy the application.
Parameters:
  PlatformName: {Type: String, Description: Provided by engineering., AllowedPattern: '[a-z][a-z0-9-]{2,19}'}
  AlbGroup: {Type: String, Default: A, AllowedValues: [A, B, C, D, E], Description: Provided by engineering.}
  ListenerSlot: {Type: Number, MinValue: 1, MaxValue: 30, Description: Provided by engineering. Unique within the ALB group.}
  JenkinsAgentRoleArn:
    Type: String
    AllowedPattern: arn:aws:iam::[0-9]{12}:role/.+
    Description: Provided by engineering. IAM role for this student's isolated Jenkins agent.
Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Credentials used by Jenkins to prepare this student database on shared RDS.
      Name: {'Fn::Sub': ['${PlatformName}/${EnvironmentId}/database', {EnvironmentId: {Ref: 'AWS::StackName'}}]}
      GenerateSecretString:
        SecretStringTemplate:
          Fn::Sub:
          - '{"username":"etp_${EnvironmentId}","database":"etp_${EnvironmentId}","host":"${DatabaseHost}","port":5432}'
          - {EnvironmentId: {Ref: 'AWS::StackName'}, DatabaseHost: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-DatabaseHost'}}}
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
      - {Key: Platform, Value: {Ref: PlatformName}}
      - {Key: Environment, Value: {Ref: 'AWS::StackName'}}
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: {'Fn::Sub': ['${PlatformName}/${EnvironmentId}/jwt', {EnvironmentId: {Ref: 'AWS::StackName'}}]}
      GenerateSecretString: {SecretStringTemplate: '{}', GenerateStringKey: JWT_SECRET, PasswordLength: 64, ExcludePunctuation: true}
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
        - Id: RemoveOldVersions
          Status: Enabled
          NoncurrentVersionExpiration: {NoncurrentDays: 7}
          AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
      Tags:
      - {Key: Platform, Value: {Ref: PlatformName}}
      - {Key: Environment, Value: {Ref: 'AWS::StackName'}}
      BucketName: {'Fn::Sub': ['${PlatformName}-${AWS::AccountId}-${AWS::Region}-${EnvironmentId}', {EnvironmentId: {Ref: 'AWS::StackName'}}]}
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: {'Fn::Sub': '${PlatformName}-${AWS::StackName}-s3'}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SpaRouting:
    Type: AWS::CloudFront::Function
    Properties:
      Name: {'Fn::Sub': '${PlatformName}-${AWS::StackName}-spa'}
      AutoPublish: true
      FunctionConfig: {Comment: Angular deep links, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var segment = request.uri.substring(request.uri.lastIndexOf('/') + 1);
          if (segment.indexOf('.') === -1) request.uri = '/index.html';
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
        - Id: private-s3
          DomainName: {'Fn::GetAtt': [UiBucket, RegionalDomainName]}
          OriginAccessControlId: {'Fn::GetAtt': [OriginAccessControl, Id]}
          S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: private-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          CachedMethods:
          - GET
          - HEAD
          Compress: true
          CachePolicyId: {Ref: UiCachePolicy}
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
          - {EventType: viewer-request, FunctionARN: {'Fn::GetAtt': [SpaRouting, FunctionARN]}}
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
      Tags:
      - {Key: Platform, Value: {Ref: PlatformName}}
      - {Key: Environment, Value: {Ref: 'AWS::StackName'}}
  UiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: {'Fn::Sub': '${PlatformName}-${AWS::StackName}-ui'}
        MinTTL: 0
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: {Ref: UiBucket}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: CloudFrontOnly
          Effect: Allow
          Principal: {Service: cloudfront.amazonaws.com}
          Action: s3:GetObject
          Resource: {'Fn::Sub': '${UiBucket.Arn}/*'}
          Condition: {StringEquals: {'AWS:SourceArn': {'Fn::Sub': 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'}}}
        - Sid: RequireTls
          Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - {'Fn::GetAtt': [UiBucket, Arn]}
          - {'Fn::Sub': '${UiBucket.Arn}/*'}
          Condition: {Bool: {'aws:SecureTransport': false}}
  ApplicationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: {'Fn::Sub': ['/fidelity/${PlatformName}/etp-${EnvironmentId}', {EnvironmentId: {Ref: 'AWS::StackName'}}]}
      RetentionInDays: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-LogRetentionDays'}}
  ApiTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-VpcId'}}
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /actuator/health
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
      - {Key: deregistration_delay.timeout_seconds, Value: '15'}
      Tags:
      - {Key: Platform, Value: {Ref: PlatformName}}
  AuthTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-VpcId'}}
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /docs/json
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
      - {Key: deregistration_delay.timeout_seconds, Value: '15'}
      Tags:
      - {Key: Platform, Value: {Ref: PlatformName}}
  AnalyticsTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-VpcId'}}
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
      - {Key: deregistration_delay.timeout_seconds, Value: '15'}
      Tags:
      - {Key: Platform, Value: {Ref: PlatformName}}
  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: {'Fn::ImportValue': {'Fn::Sub': ['${PlatformName}-ListenerArn${Letter}', {Letter: {Ref: AlbGroup}}]}}
      Priority: {'Fn::Sub': ['${ListenerSlot}1', {ListenerSlot: {Ref: ListenerSlot}}]}
      Conditions:
      - Field: host-header
        Values:
        - Fn::Sub:
          - api-${EnvironmentId}.${BaseDomain}
          - {EnvironmentId: {Ref: 'AWS::StackName'}, BaseDomain: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-BaseDomain'}}}
      Actions:
      - {Type: forward, TargetGroupArn: {Ref: ApiTargets}}
  AuthRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: {'Fn::ImportValue': {'Fn::Sub': ['${PlatformName}-ListenerArn${Letter}', {Letter: {Ref: AlbGroup}}]}}
      Priority: {'Fn::Sub': ['${ListenerSlot}2', {ListenerSlot: {Ref: ListenerSlot}}]}
      Conditions:
      - Field: host-header
        Values:
        - Fn::Sub:
          - auth-${EnvironmentId}.${BaseDomain}
          - {EnvironmentId: {Ref: 'AWS::StackName'}, BaseDomain: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-BaseDomain'}}}
      Actions:
      - {Type: forward, TargetGroupArn: {Ref: AuthTargets}}
  AnalyticsRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: {'Fn::ImportValue': {'Fn::Sub': ['${PlatformName}-ListenerArn${Letter}', {Letter: {Ref: AlbGroup}}]}}
      Priority: {'Fn::Sub': ['${ListenerSlot}3', {ListenerSlot: {Ref: ListenerSlot}}]}
      Conditions:
      - Field: host-header
        Values:
        - Fn::Sub:
          - report-${EnvironmentId}.${BaseDomain}
          - {EnvironmentId: {Ref: 'AWS::StackName'}, BaseDomain: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-BaseDomain'}}}
      - {Field: path-pattern, Values: [/, /index.html]}
      Actions:
      - {Type: forward, TargetGroupArn: {Ref: AnalyticsTargets}}
  Dns:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-HostedZoneId'}}
      RecordSets:
      - Name:
          Fn::Sub:
          - api-${EnvironmentId}.${BaseDomain}
          - {EnvironmentId: {Ref: 'AWS::StackName'}, BaseDomain: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-BaseDomain'}}}
        Type: A
        AliasTarget:
          DNSName: {'Fn::ImportValue': {'Fn::Sub': ['${PlatformName}-AlbDns${Letter}', {Letter: {Ref: AlbGroup}}]}}
          HostedZoneId: {'Fn::ImportValue': {'Fn::Sub': ['${PlatformName}-AlbZone${Letter}', {Letter: {Ref: AlbGroup}}]}}
          EvaluateTargetHealth: false
      - Name:
          Fn::Sub:
          - auth-${EnvironmentId}.${BaseDomain}
          - {EnvironmentId: {Ref: 'AWS::StackName'}, BaseDomain: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-BaseDomain'}}}
        Type: A
        AliasTarget:
          DNSName: {'Fn::ImportValue': {'Fn::Sub': ['${PlatformName}-AlbDns${Letter}', {Letter: {Ref: AlbGroup}}]}}
          HostedZoneId: {'Fn::ImportValue': {'Fn::Sub': ['${PlatformName}-AlbZone${Letter}', {Letter: {Ref: AlbGroup}}]}}
          EvaluateTargetHealth: false
      - Name:
          Fn::Sub:
          - report-${EnvironmentId}.${BaseDomain}
          - {EnvironmentId: {Ref: 'AWS::StackName'}, BaseDomain: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-BaseDomain'}}}
        Type: A
        AliasTarget:
          DNSName: {'Fn::ImportValue': {'Fn::Sub': ['${PlatformName}-AlbDns${Letter}', {Letter: {Ref: AlbGroup}}]}}
          HostedZoneId: {'Fn::ImportValue': {'Fn::Sub': ['${PlatformName}-AlbZone${Letter}', {Letter: {Ref: AlbGroup}}]}}
          EvaluateTargetHealth: false
  ReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - {Effect: Allow, Action: 'sts:AssumeRole', Principal: {AWS: {Ref: JenkinsAgentRoleArn}}}
      Policies:
      - PolicyName: ReleaseThisEnvironment
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: {Ref: DatabaseSecret}}
          - Effect: Allow
            Action: eks:DescribeCluster
            Resource:
              Fn::Sub:
              - arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
              - {ClusterName: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-ClusterName'}}}
          - {Effect: Allow, Action: 's3:ListBucket', Resource: {'Fn::GetAtt': [UiBucket, Arn]}}
          - {Effect: Allow, Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject'], Resource: {'Fn::Sub': '${UiBucket.Arn}/*'}}
          - Effect: Allow
            Action:
            - cloudfront:CreateInvalidation
            - cloudfront:GetInvalidation
            Resource: {'Fn::Sub': 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'}
          - Effect: Allow
            Action:
            - cloudformation:DescribeStacks
            - cloudformation:DescribeStackEvents
            Resource: {Ref: 'AWS::StackId'}
          - Effect: Allow
            Action:
            - logs:FilterLogEvents
            - logs:GetLogEvents
            - logs:DescribeLogStreams
            Resource: {'Fn::GetAtt': [ApplicationLogs, Arn]}
  ReleaseAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-ClusterName'}}
      PrincipalArn: {'Fn::GetAtt': [ReleaseRole, Arn]}
      Type: STANDARD
      KubernetesGroups:
      - {'Fn::Sub': ['etp:${EnvironmentId}:deploy', {EnvironmentId: {Ref: 'AWS::StackName'}}]}
Outputs:
  EnvironmentId: {Value: {Ref: 'AWS::StackName'}}
  Namespace: {Value: {'Fn::Sub': ['etp-${EnvironmentId}', {EnvironmentId: {Ref: 'AWS::StackName'}}]}}
  PlatformName: {Value: {Ref: PlatformName}}
  ClusterName: {Value: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-ClusterName'}}}
  DatabaseHost: {Value: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-DatabaseHost'}}}
  DatabaseSecretArn: {Value: {Ref: DatabaseSecret}}
  JwtSecretArn: {Value: {Ref: JwtSecret}}
  BucketName: {Value: {Ref: UiBucket}}
  DistributionId: {Value: {Ref: Distribution}}
  FrontendUrl: {Value: {'Fn::Sub': 'https://${Distribution.DomainName}'}}
  ApiUrl:
    Value:
      Fn::Sub:
      - https://api-${EnvironmentId}.${BaseDomain}
      - {EnvironmentId: {Ref: 'AWS::StackName'}, BaseDomain: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-BaseDomain'}}}
  AuthUrl:
    Value:
      Fn::Sub:
      - https://auth-${EnvironmentId}.${BaseDomain}
      - {EnvironmentId: {Ref: 'AWS::StackName'}, BaseDomain: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-BaseDomain'}}}
  AnalyticsUrl:
    Value:
      Fn::Sub:
      - https://report-${EnvironmentId}.${BaseDomain}
      - {EnvironmentId: {Ref: 'AWS::StackName'}, BaseDomain: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-BaseDomain'}}}
  ApiTargetGroupArn: {Value: {Ref: ApiTargets}}
  AuthTargetGroupArn: {Value: {Ref: AuthTargets}}
  AnalyticsTargetGroupArn: {Value: {Ref: AnalyticsTargets}}
  ReleaseRoleArn: {Value: {'Fn::GetAtt': [ReleaseRole, Arn]}}
  LogGroupName: {Value: {Ref: ApplicationLogs}}
  JenkinsUrl:
    Value:
      Fn::Sub:
      - ${Url}/job/${PlatformName}-${AWS::StackName}/
      - {Url: {'Fn::ImportValue': {'Fn::Sub': '${PlatformName}-JenkinsUrl'}}}
