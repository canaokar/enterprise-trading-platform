AWSTemplateFormatVersion: '2010-09-09'
Description: Shared training infrastructure and automatic EKS setup.
Parameters:
  JenkinsApiSecretArn:
    Type: String
    Description: Existing Secrets Manager secret containing Jenkins username and apiToken.
    AllowedPattern: arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+
  JFrogHost:
    Type: String
    Description: JFrog registry hostname, without https://.
    AllowedPattern: '[a-z0-9][a-z0-9.-]+'
  JFrogRepository:
    Type: String
    Default: docker-local
    AllowedPattern: '[a-zA-Z0-9_.-]+'
  DeploymentRepositoryUrl:
    Type: String
    Default: https://github.com/canaokar/enterprise-trading-platform.git
    AllowedPattern: https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git
  DeploymentRevision:
    Type: String
    Default: reference
    Description: Engineering-controlled deployment kit branch or commit.
  StudentCount:
    Type: Number
    Default: 143
    MinValue: 1
    MaxValue: 143
  FirstStudentNumber: {Type: Number, Default: 1, MinValue: 1, MaxValue: 143}
  BootstrapAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  PlatformName: {Type: String, Default: fidelity-lab, AllowedPattern: '[a-z][a-z0-9-]{2,19}'}
  KubernetesVersion:
    Type: String
    Description: Select an EKS version in standard support in this region before deployment.
    AllowedPattern: 1\.[0-9]{2}
  PlatformAdminRoleArn:
    Type: String
    Description: Existing engineering role used by the Jenkins controller and platform agent. Use an IAM role ARN.
    AllowedPattern: arn:aws:iam::[0-9]{12}:role/.+
  ApiAccessCidr:
    Type: String
    Description: Engineering or VPN public IPv4 CIDR allowed to reach the EKS API. Prefer a /32.
    AllowedPattern: (\d{1,3}\.){3}\d{1,3}/\d{1,2}
  VpcCidr:
    Type: String
    Default: 10.80.0.0/16
    AllowedPattern: 10\.\d{1,3}\.0\.0/16
    Description: Use distinct non-overlapping /16 ranges if regional platforms will be connected.
  HostedZoneId: {Type: 'AWS::Route53::HostedZone::Id', Description: Existing public hosted zone with working delegation.}
  BaseDomain:
    Type: String
    Description: Delegated lab domain, for example lab.example.com. No trailing dot.
    AllowedPattern: '[a-z0-9][a-z0-9.-]+\.[a-z]{2,}'
  WorkerInstanceType: {Type: String, Default: m6i.2xlarge, AllowedValues: [m6i.xlarge, m6i.2xlarge, m6i.4xlarge]}
  WorkerCount:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 30
    Description: Two nodes are pilot capacity. Engineering must set measured classroom capacity.
  DbInstanceClass: {Type: String, Default: db.t4g.large, AllowedValues: [db.t4g.large, db.m6g.large, db.m6g.xlarge, db.m6g.2xlarge]}
  DbEngineVersion:
    Type: String
    Description: Exact PostgreSQL 16 minor version available in this region. Query describe-db-engine-versions before deployment.
    AllowedPattern: 16\.[0-9]+
  DbStorageGiB: {Type: Number, Default: 100, MinValue: 20, MaxValue: 1000}
  ProtectDatabase:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
    Description: Set false through a reviewed stack update only when preparing final teardown.
  LogRetentionDays: {Type: Number, Default: 7, AllowedValues: [3, 5, 7, 14, 30]}
  AlbCount:
    Type: Number
    Default: 1
    AllowedValues:
    - 1
    - 2
    - 3
    - 4
    - 5
    Description: One ALB per 30 students. Five supports 143 students.
  JenkinsUrl: {Type: String, Description: 'Existing Jenkins URL, without a trailing slash.', AllowedPattern: 'https://[^ ]+[^/]'}
Conditions:
  DatabaseProtected: {'Fn::Equals': [{Ref: ProtectDatabase}, 'true']}
  AlbBEnabled:
    Fn::Or:
    - {'Fn::Equals': [{Ref: AlbCount}, 2]}
    - {'Fn::Equals': [{Ref: AlbCount}, 3]}
    - {'Fn::Equals': [{Ref: AlbCount}, 4]}
    - {'Fn::Equals': [{Ref: AlbCount}, 5]}
  AlbCEnabled:
    Fn::Or:
    - {'Fn::Equals': [{Ref: AlbCount}, 3]}
    - {'Fn::Equals': [{Ref: AlbCount}, 4]}
    - {'Fn::Equals': [{Ref: AlbCount}, 5]}
  AlbDEnabled: {'Fn::Or': [{'Fn::Equals': [{Ref: AlbCount}, 4]}, {'Fn::Equals': [{Ref: AlbCount}, 5]}]}
  AlbEEnabled: {'Fn::Equals': [{Ref: AlbCount}, 5]}
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: {Ref: VpcCidr}
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
      - {Key: Name, Value: {Ref: PlatformName}}
  InternetGateway: {Type: 'AWS::EC2::InternetGateway'}
  GatewayAttachment: {Type: 'AWS::EC2::VPCGatewayAttachment', Properties: {VpcId: {Ref: Vpc}, InternetGatewayId: {Ref: InternetGateway}}}
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: Vpc}
      AvailabilityZone: {'Fn::Select': [0, {'Fn::GetAZs': ''}]}
      CidrBlock: {'Fn::Select': [0, {'Fn::Cidr': [{Ref: VpcCidr}, 2, 8]}]}
      MapPublicIpOnLaunch: false
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: Vpc}
      AvailabilityZone: {'Fn::Select': [1, {'Fn::GetAZs': ''}]}
      CidrBlock: {'Fn::Select': [1, {'Fn::Cidr': [{Ref: VpcCidr}, 2, 8]}]}
      MapPublicIpOnLaunch: false
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: Vpc}
      AvailabilityZone: {'Fn::Select': [0, {'Fn::GetAZs': ''}]}
      CidrBlock: {'Fn::Select': [1, {'Fn::Cidr': [{Ref: VpcCidr}, 3, 13]}]}
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: Vpc}
      AvailabilityZone: {'Fn::Select': [1, {'Fn::GetAZs': ''}]}
      CidrBlock: {'Fn::Select': [2, {'Fn::Cidr': [{Ref: VpcCidr}, 3, 13]}]}
  PublicRoutes: {Type: 'AWS::EC2::RouteTable', Properties: {VpcId: {Ref: Vpc}}}
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: {Ref: PublicRoutes}, DestinationCidrBlock: 0.0.0.0/0, GatewayId: {Ref: InternetGateway}}
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: {Ref: PublicA}, RouteTableId: {Ref: PublicRoutes}}
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: {Ref: PublicB}, RouteTableId: {Ref: PublicRoutes}}
  NatAddress: {Type: 'AWS::EC2::EIP', DependsOn: GatewayAttachment, Properties: {Domain: vpc}}
  Nat:
    Type: AWS::EC2::NatGateway
    Properties: {AllocationId: {'Fn::GetAtt': [NatAddress, AllocationId]}, SubnetId: {Ref: PublicA}}
  PrivateRoutes: {Type: 'AWS::EC2::RouteTable', Properties: {VpcId: {Ref: Vpc}}}
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: {Ref: PrivateRoutes}, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: {Ref: Nat}}
  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: {Ref: PrivateA}, RouteTableId: {Ref: PrivateRoutes}}
  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: {Ref: PrivateB}, RouteTableId: {Ref: PrivateRoutes}}
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: {Ref: Vpc}
      ServiceName: {'Fn::Sub': 'com.amazonaws.${AWS::Region}.s3'}
      VpcEndpointType: Gateway
      RouteTableIds:
      - {Ref: PrivateRoutes}
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS lab ingress
      VpcId: {Ref: Vpc}
      SecurityGroupIngress:
      - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: {GroupDescription: PostgreSQL from application nodes and trusted bootstrap workers, VpcId: {Ref: Vpc}}
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - {Effect: Allow, Principal: {Service: eks.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns:
      - {'Fn::Sub': 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy'}
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns:
      - {'Fn::Sub': 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy'}
      - {'Fn::Sub': 'arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly'}
  ClusterLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: {'Fn::Sub': '/aws/eks/${PlatformName}/cluster'}, RetentionInDays: {Ref: LogRetentionDays}}
  Cluster:
    Type: AWS::EKS::Cluster
    DependsOn: ClusterLogs
    Properties:
      Name: {Ref: PlatformName}
      Version: {Ref: KubernetesVersion}
      RoleArn: {'Fn::GetAtt': [ClusterRole, Arn]}
      AccessConfig: {AuthenticationMode: API, BootstrapClusterCreatorAdminPermissions: false}
      UpgradePolicy: {SupportType: STANDARD}
      ResourcesVpcConfig:
        SubnetIds:
        - {Ref: PrivateA}
        - {Ref: PrivateB}
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs:
        - {Ref: ApiAccessCidr}
      Logging: {ClusterLogging: {EnabledTypes: [{Type: api}, {Type: audit}, {Type: authenticator}]}}
  AdminAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: {Ref: Cluster}
      PrincipalArn: {Ref: PlatformAdminRoleArn}
      Type: STANDARD
      AccessPolicies:
      - PolicyArn: {'Fn::Sub': 'arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy'}
        AccessScope: {Type: cluster}
  NodeTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions: {HttpEndpoint: enabled, HttpTokens: required, HttpPutResponseHopLimit: 1}
        BlockDeviceMappings:
        - {DeviceName: /dev/xvda, Ebs: {Encrypted: true, VolumeSize: 40, VolumeType: gp3, DeleteOnTermination: true}}
  Workers:
    Type: AWS::EKS::Nodegroup
    DependsOn:
    - PrivateDefaultRoute
    - PrivateAssociationA
    - PrivateAssociationB
    - VpcCni
    Properties:
      ClusterName: {Ref: Cluster}
      NodeRole: {'Fn::GetAtt': [NodeRole, Arn]}
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      InstanceTypes:
      - {Ref: WorkerInstanceType}
      Subnets:
      - {Ref: PrivateA}
      - {Ref: PrivateB}
      LaunchTemplate: {Id: {Ref: NodeTemplate}, Version: {'Fn::GetAtt': [NodeTemplate, LatestVersionNumber]}}
      ScalingConfig: {MinSize: 2, DesiredSize: {Ref: WorkerCount}, MaxSize: 30}
      UpdateConfig: {MaxUnavailable: 1}
      Labels: {workload: applications}
  CniRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - {Effect: Allow, Principal: {Service: pods.eks.amazonaws.com}, Action: ['sts:AssumeRole', 'sts:TagSession']}
      ManagedPolicyArns:
      - {'Fn::Sub': 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy'}
  VpcCni:
    Type: AWS::EKS::Addon
    DependsOn: PodIdentityAgent
    Properties:
      ClusterName: {Ref: Cluster}
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE
      ConfigurationValues: '{"enableNetworkPolicy":"true","env":{"ENABLE_PREFIX_DELEGATION":"true","WARM_PREFIX_TARGET":"1"}}'
      PodIdentityAssociations:
      - {RoleArn: {'Fn::GetAtt': [CniRole, Arn]}, ServiceAccount: aws-node}
  PodIdentityAgent:
    Type: AWS::EKS::Addon
    Properties: {ClusterName: {Ref: Cluster}, AddonName: eks-pod-identity-agent, ResolveConflicts: OVERWRITE}
  CoreDns:
    Type: AWS::EKS::Addon
    DependsOn: Workers
    Properties: {ClusterName: {Ref: Cluster}, AddonName: coredns, ResolveConflicts: OVERWRITE}
  KubeProxy:
    Type: AWS::EKS::Addon
    Properties: {ClusterName: {Ref: Cluster}, AddonName: kube-proxy, ResolveConflicts: OVERWRITE}
  EbsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - {Effect: Allow, Principal: {Service: pods.eks.amazonaws.com}, Action: ['sts:AssumeRole', 'sts:TagSession']}
      ManagedPolicyArns:
      - {'Fn::Sub': 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy'}
  EbsAddon:
    Type: AWS::EKS::Addon
    DependsOn:
    - Workers
    - PodIdentityAgent
    Properties:
      ClusterName: {Ref: Cluster}
      AddonName: aws-ebs-csi-driver
      ResolveConflicts: OVERWRITE
      PodIdentityAssociations:
      - {RoleArn: {'Fn::GetAtt': [EbsRole, Arn]}, ServiceAccount: ebs-csi-controller-sa}
  TargetBindingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - {Effect: Allow, Principal: {Service: pods.eks.amazonaws.com}, Action: ['sts:AssumeRole', 'sts:TagSession']}
      Policies:
      - PolicyName: BindExistingTargets
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - {Effect: Allow, Action: ['ec2:Describe*', 'elasticloadbalancing:Describe*'], Resource: '*'}
          - Effect: Allow
            Action:
            - elasticloadbalancing:RegisterTargets
            - elasticloadbalancing:DeregisterTargets
            Resource: {'Fn::Sub': 'arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/*/*'}
            Condition: {StringEquals: {'aws:ResourceTag/Platform': {Ref: PlatformName}}}
  TargetBindingIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: {Ref: Cluster}
      Namespace: kube-system
      ServiceAccount: aws-load-balancer-controller
      RoleArn: {'Fn::GetAtt': [TargetBindingRole, Arn]}
  LogWriterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - {Effect: Allow, Principal: {Service: pods.eks.amazonaws.com}, Action: ['sts:AssumeRole', 'sts:TagSession']}
      Policies:
      - PolicyName: WriteLabLogs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            - logs:DescribeLogStreams
            Resource: {'Fn::Sub': 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/fidelity/${PlatformName}/*:*'}
  LogWriterIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: {Ref: Cluster}
      Namespace: amazon-cloudwatch
      ServiceAccount: fluent-bit
      RoleArn: {'Fn::GetAtt': [LogWriterRole, Arn]}
  DbNodeIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {Ref: DbSecurityGroup}
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: {'Fn::GetAtt': [Cluster, ClusterSecurityGroupId]}
  AlbNodeIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {'Fn::GetAtt': [Cluster, ClusterSecurityGroupId]}
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 8080
      SourceSecurityGroupId: {Ref: AlbSecurityGroup}
  DbSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties: {DBSubnetGroupDescription: Private training database subnets, SubnetIds: [{Ref: PrivateA}, {Ref: PrivateB}]}
  Database:
    Type: AWS::RDS::DBInstance
    DependsOn: DatabaseLogs
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceIdentifier: {'Fn::Sub': '${PlatformName}-postgres'}
      EngineVersion: {Ref: DbEngineVersion}
      DBInstanceClass: {Ref: DbInstanceClass}
      AllocatedStorage: {Ref: DbStorageGiB}
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      DBSubnetGroupName: {Ref: DbSubnets}
      VPCSecurityGroups:
      - {Ref: DbSecurityGroup}
      MasterUsername: platform_admin
      ManageMasterUserPassword: true
      BackupRetentionPeriod: 1
      DeletionProtection: {'Fn::If': [DatabaseProtected, true, false]}
      EnableCloudwatchLogsExports:
      - postgresql
      Tags:
      - {Key: Platform, Value: {Ref: PlatformName}}
  DatabaseLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: {'Fn::Sub': '/aws/rds/instance/${PlatformName}-postgres/postgresql'}, RetentionInDays: {Ref: LogRetentionDays}}
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: {'Fn::Sub': '*.${BaseDomain}'}
      ValidationMethod: DNS
      DomainValidationOptions:
      - {DomainName: {'Fn::Sub': '*.${BaseDomain}'}, HostedZoneId: {Ref: HostedZoneId}}
  AlbA:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
      - {Ref: PublicA}
      - {Ref: PublicB}
      SecurityGroups:
      - {Ref: AlbSecurityGroup}
  ListenerA:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: {Ref: AlbA}
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
      - {CertificateArn: {Ref: Certificate}}
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig: {StatusCode: '404', ContentType: text/plain, MessageBody: Unknown lab environment}
  AlbB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
      - {Ref: PublicA}
      - {Ref: PublicB}
      SecurityGroups:
      - {Ref: AlbSecurityGroup}
    Condition: AlbBEnabled
  ListenerB:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: {Ref: AlbB}
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
      - {CertificateArn: {Ref: Certificate}}
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig: {StatusCode: '404', ContentType: text/plain, MessageBody: Unknown lab environment}
    Condition: AlbBEnabled
  AlbC:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
      - {Ref: PublicA}
      - {Ref: PublicB}
      SecurityGroups:
      - {Ref: AlbSecurityGroup}
    Condition: AlbCEnabled
  ListenerC:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: {Ref: AlbC}
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
      - {CertificateArn: {Ref: Certificate}}
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig: {StatusCode: '404', ContentType: text/plain, MessageBody: Unknown lab environment}
    Condition: AlbCEnabled
  AlbD:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
      - {Ref: PublicA}
      - {Ref: PublicB}
      SecurityGroups:
      - {Ref: AlbSecurityGroup}
    Condition: AlbDEnabled
  ListenerD:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: {Ref: AlbD}
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
      - {CertificateArn: {Ref: Certificate}}
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig: {StatusCode: '404', ContentType: text/plain, MessageBody: Unknown lab environment}
    Condition: AlbDEnabled
  AlbE:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
      - {Ref: PublicA}
      - {Ref: PublicB}
      SecurityGroups:
      - {Ref: AlbSecurityGroup}
    Condition: AlbEEnabled
  ListenerE:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: {Ref: AlbE}
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
      - {CertificateArn: {Ref: Certificate}}
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig: {StatusCode: '404', ContentType: text/plain, MessageBody: Unknown lab environment}
    Condition: AlbEEnabled
  JenkinsSecurityGroup: {Type: 'AWS::EC2::SecurityGroup', Properties: {GroupDescription: Jenkins agents in the training VPC, VpcId: {
        Ref: Vpc}}}
  JenkinsDatabaseAccess:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {Ref: DbSecurityGroup}
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: {Ref: JenkinsSecurityGroup}
  JenkinsClusterAccess:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {'Fn::GetAtt': [Cluster, ClusterSecurityGroupId]}
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: {Ref: JenkinsSecurityGroup}
  BootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
      - PolicyName: InitialiseCluster
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: eks:DescribeCluster
            Resource:
              Fn::GetAtt:
              - Cluster
              - Arn
          - Effect: Allow
            Action:
            - cloudformation:DescribeStackResource
            - cloudformation:SignalResource
            Resource:
              Ref: AWS::StackId
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Ref: JenkinsApiSecretArn
  BootstrapProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - Ref: BootstrapRole
  BootstrapAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName:
        Ref: Cluster
      PrincipalArn:
        Fn::GetAtt:
        - BootstrapRole
        - Arn
      Type: STANDARD
      AccessPolicies:
      - PolicyArn:
          Fn::Sub: arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
        AccessScope:
          Type: cluster
  Bootstrap:
    Type: AWS::EC2::Instance
    DependsOn:
    - Workers
    - CoreDns
    - EbsAddon
    - BootstrapAccess
    - TargetBindingIdentity
    - LogWriterIdentity
    - JenkinsClusterAccess
    CreationPolicy:
      ResourceSignal:
        Timeout: PT25M
    Metadata:
      AWS::CloudFormation::Init:
        config:
          files:
            /opt/platform.yaml:
              content:
                Fn::Sub: |
                  apiVersion: storage.k8s.io/v1
                  kind: StorageClass
                  metadata: {name: etp-gp3}
                  provisioner: ebs.csi.aws.com
                  parameters: {type: gp3, encrypted: 'true'}
                  volumeBindingMode: WaitForFirstConsumer
                  allowVolumeExpansion: true
                  reclaimPolicy: Delete
                  ---
                  apiVersion: admissionregistration.k8s.io/v1
                  kind: ValidatingAdmissionPolicy
                  metadata: {name: etp-clusterip-services}
                  spec:
                    failurePolicy: Fail
                    matchConstraints: {resourceRules: [{apiGroups: [''], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [services]}]}
                    validations:
                    - expression: (!has(object.spec.type) || object.spec.type == 'ClusterIP') && (!has(object.spec.externalIPs) || size(object.spec.externalIPs)
                        == 0)
                      message: Training services must use ClusterIP without externalIPs. Engineering owns public routing.
                  ---
                  apiVersion: admissionregistration.k8s.io/v1
                  kind: ValidatingAdmissionPolicyBinding
                  metadata: {name: etp-clusterip-services}
                  spec:
                    policyName: etp-clusterip-services
                    validationActions:
                    - Deny
                    matchResources: {namespaceSelector: {matchLabels: {etp-environment: 'true'}}}
                  --- {apiVersion: v1, kind: Namespace, metadata: {name: amazon-cloudwatch}}
                  --- {apiVersion: v1, kind: ServiceAccount, metadata: {name: fluent-bit, namespace: amazon-cloudwatch}}
                  ---
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRole
                  metadata: {name: etp-fluent-bit}
                  rules:
                  - {apiGroups: [''], resources: [pods, namespaces], verbs: [get, list, watch]}
                  ---
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRoleBinding
                  metadata: {name: etp-fluent-bit}
                  subjects:
                  - {kind: ServiceAccount, name: fluent-bit, namespace: amazon-cloudwatch}
                  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: etp-fluent-bit}
                  ---
                  apiVersion: v1
                  kind: ConfigMap
                  metadata: {name: fluent-bit, namespace: amazon-cloudwatch}
                  data:
                    fluent-bit.conf: |
                      [SERVICE]
                          Flush 5
                          Log_Level warn
                          Parsers_File /fluent-bit/parsers/parsers.conf
                      [INPUT]
                          Name tail
                          Path /var/log/containers/*_etp-*_*.log
                          Tag kube.*
                          multiline.parser docker, cri
                          DB /var/fluent-bit/state/tail.db
                          Mem_Buf_Limit 10MB
                          Skip_Long_Lines On
                          Read_From_Head Off
                      [FILTER]
                          Name kubernetes
                          Match kube.*
                          Merge_Log On
                          Keep_Log On
                          Labels Off
                          Annotations Off
                      [FILTER]
                          Name grep
                          Match kube.*
                          Regex $kubernetes['namespace_name'] ^etp-
                      [OUTPUT]
                          Name cloudwatch_logs
                          Match kube.*
                          region ${AWS::Region}
                          log_group_name /fidelity/${PlatformName}/unknown
                          log_group_template /fidelity/${PlatformName}/$kubernetes['namespace_name']
                          log_stream_prefix application-
                          auto_create_group false
                          Retry_Limit 5
                  ---
                  apiVersion: apps/v1
                  kind: DaemonSet
                  metadata: {name: fluent-bit, namespace: amazon-cloudwatch}
                  spec:
                    selector: {matchLabels: {app: fluent-bit}}
                    template:
                      metadata: {labels: {app: fluent-bit}}
                      spec:
                        serviceAccountName: fluent-bit
                        nodeSelector: {kubernetes.io/os: linux}
                        containers:
                        - name: fluent-bit
                          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:3.2.1
                          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
                          volumeMounts:
                          - {name: logs, mountPath: /var/log, readOnly: true}
                          - {name: state, mountPath: /var/fluent-bit/state}
                          - {name: config, mountPath: /fluent-bit/etc/fluent-bit.conf, subPath: fluent-bit.conf, readOnly: true}
                        volumes:
                        - {name: logs, hostPath: {path: /var/log, type: Directory}}
                        - {name: state, hostPath: {path: /var/lib/etp-fluent-bit, type: DirectoryOrCreate}}
                        - {name: config, configMap: {name: fluent-bit}}
              mode: '000600'
            /opt/jenkins-jobs.py:
              content: |
                import base64, json, subprocess
                import urllib.error, urllib.parse, urllib.request
                import xml.etree.ElementTree as ET

                config = json.load(open('/opt/jenkins-jobs.json'))
                secret = json.loads(subprocess.check_output([
                    'aws', 'secretsmanager', 'get-secret-value', '--secret-id', config['secret'],
                    '--region', config['region'], '--query', 'SecretString', '--output', 'text'], text=True))
                auth = base64.b64encode((secret['username'] + ':' + secret['apiToken']).encode()).decode()

                def request(path, data=None):
                    req = urllib.request.Request(config['url'] + path, data=data,
                        headers={'Authorization': 'Basic ' + auth, 'Content-Type': 'application/xml'})
                    with urllib.request.urlopen(req, timeout=30) as response:
                        return response.read()

                def element(parent, name, text=None, **attrs):
                    child = ET.SubElement(parent, name, attrs)
                    child.text = text
                    return child

                folder = '/job/' + config['region']
                try:
                    request(folder + '/api/json')
                except urllib.error.HTTPError as error:
                    if error.code != 404:
                        raise
                    request('/createItem?' + urllib.parse.urlencode({'name': config['region']}),
                        b'<com.cloudbees.hudson.plugins.folder.Folder plugin="cloudbees-folder"><properties/></com.cloudbees.hudson.plugins.folder.Folder>')
                first, count = int(config['first']), int(config['students'])
                if first + count - 1 > 143:
                    raise ValueError('Student numbers must be within s001 to s143')
                for number in range(first, first + count):
                    student = f's{number:03d}'
                    name = config['platform'] + '-' + student
                    marker = 'Training deployment: ' + name
                    root = ET.Element('flow-definition', plugin='workflow-job')
                    element(root, 'description', marker)
                    permissions = element(element(root, 'properties'), 'hudson.security.AuthorizationMatrixProperty')
                    for permission in ['Read', 'Build', 'Cancel']:
                        element(permissions, 'permission', 'USER:hudson.model.Item.' + permission + ':' + student)
                    definition = element(root, 'definition', **{'class': 'org.jenkinsci.plugins.workflow.cps.CpsScmFlowDefinition', 'plugin': 'workflow-cps'})
                    scm = element(definition, 'scm', **{'class': 'hudson.plugins.git.GitSCM', 'plugin': 'git'})
                    element(scm, 'configVersion', '2')
                    remote = element(element(scm, 'userRemoteConfigs'), 'hudson.plugins.git.UserRemoteConfig')
                    element(remote, 'url', config['repository'])
                    element(remote, 'credentialsId', 'github-read')
                    element(element(element(scm, 'branches'), 'hudson.plugins.git.BranchSpec'), 'name', config['revision'])
                    element(definition, 'scriptPath', 'deploy/Jenkinsfile')
                    element(definition, 'lightweight', 'true')
                    element(root, 'disabled', 'false')
                    job = folder + '/job/' + urllib.parse.quote(name, safe='') + '/config.xml'
                    try:
                        existing = ET.fromstring(request(job))
                        if existing.findtext('description') != marker:
                            raise ValueError('Job already exists outside this kit: ' + name)
                    except urllib.error.HTTPError as error:
                        if error.code != 404:
                            raise
                        job = folder + '/createItem?' + urllib.parse.urlencode({'name': name})
                    request(job, ET.tostring(root, encoding='utf-8'))
                    print('Configured ' + name)
              mode: '000600'
            /opt/jenkins-jobs.json:
              content:
                secret:
                  Ref: JenkinsApiSecretArn
                region:
                  Ref: AWS::Region
                url:
                  Ref: JenkinsUrl
                platform:
                  Ref: PlatformName
                students:
                  Ref: StudentCount
                first:
                  Ref: FirstStudentNumber
                repository:
                  Ref: DeploymentRepositoryUrl
                revision:
                  Ref: DeploymentRevision
              mode: '000600'
    Properties:
      ImageId:
        Ref: BootstrapAmi
      InstanceType: t3.small
      SubnetId:
        Ref: PrivateA
      SecurityGroupIds:
      - Ref: JenkinsSecurityGroup
      IamInstanceProfile:
        Ref: BootstrapProfile
      BlockDeviceMappings:
      - DeviceName: /dev/xvda
        Ebs:
          VolumeSize: 16
          VolumeType: gp3
          Encrypted: true
          DeleteOnTermination: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${PlatformName}-setup
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euo pipefail
            dnf install -y aws-cfn-bootstrap tar gzip
            trap '/opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource Bootstrap --region ${AWS::Region}' EXIT
            /opt/aws/bin/cfn-init --stack ${AWS::StackName} --resource Bootstrap --region ${AWS::Region}
            version=$(curl -fsSL https://dl.k8s.io/release/stable-${KubernetesVersion}.txt)
            curl -fsSL "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
            curl -fsSL "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl.sha256" -o /tmp/kubectl.sha256
            printf '%s  /usr/local/bin/kubectl\n' "$(cat /tmp/kubectl.sha256)" | sha256sum --check
            chmod +x /usr/local/bin/kubectl
            curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz -o /tmp/helm.tar.gz
            curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum -o /tmp/helm.sha256
            cd /tmp
            sed 's/helm-v3.19.0-linux-amd64.tar.gz/helm.tar.gz/' helm.sha256 | sha256sum --check
            tar -xzf helm.tar.gz
            install linux-amd64/helm /usr/local/bin/helm
            aws eks update-kubeconfig --name ${PlatformName} --region ${AWS::Region}
            helm repo add eks https://aws.github.io/eks-charts
            helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
              --namespace kube-system --version 3.5.0 \
              --set clusterName=${PlatformName},region=${AWS::Region},vpcId=${Vpc} \
              --set serviceAccount.name=aws-load-balancer-controller \
              --set enableServiceMutatorWebhook=false,enableBackendSecurityGroup=false \
              --set enableShield=false,enableWaf=false,enableWafv2=false --wait --timeout 10m
            kubectl apply -f /opt/platform.yaml
            kubectl rollout status daemonset/fluent-bit -n amazon-cloudwatch --timeout=5m
            python3 /opt/jenkins-jobs.py
