AWSTemplateFormatVersion: '2010-09-09'
Description: Fidelity training foundation. One regional stack shared by group or student environments.
Metadata:
  cfn-lint:
    config:
      # The optional AMI accepts an empty string to use an existing Jenkins service.
      ignore_checks: [W2506]

Parameters:
  PlatformName:
    Type: String
    Default: fidelity-lab
    AllowedPattern: '[a-z][a-z0-9-]{2,24}'
  KubernetesVersion:
    Type: String
    Description: Select an EKS version in standard support in this region before deployment.
    AllowedPattern: '1\.[0-9]{2}'
  PlatformAdminRoleArn:
    Type: String
    Description: Existing IAM role used by engineering. Use an IAM role ARN, not an STS session ARN.
    AllowedPattern: 'arn:aws:iam::[0-9]{12}:role/.+'
  ApiAccessCidr:
    Type: String
    Description: Engineering or VPN public IPv4 CIDR allowed to reach the EKS API. Prefer a /32.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
  VpcCidr:
    Type: String
    Default: 10.80.0.0/16
    AllowedPattern: '10\.\d{1,3}\.0\.0/16'
    Description: Use distinct non-overlapping /16 ranges if regional platforms will be connected.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing public hosted zone with working delegation.
  BaseDomain:
    Type: String
    Description: Delegated lab domain, for example lab.example.com. No trailing dot.
    AllowedPattern: '[a-z0-9][a-z0-9.-]+\.[a-z]{2,}'
  WorkerInstanceType:
    Type: String
    Default: m6i.2xlarge
    AllowedValues: [m6i.xlarge, m6i.2xlarge, m6i.4xlarge]
  WorkerCount:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 30
    Description: Pilot capacity only. Set from measured active-group demand before teaching.
  DbInstanceClass:
    Type: String
    Default: db.t4g.large
    AllowedValues: [db.t4g.large, db.m6g.large, db.m6g.xlarge, db.m6g.2xlarge]
  DbEngineVersion:
    Type: String
    Description: Exact PostgreSQL 16 minor version available in this region. Query describe-db-engine-versions before deployment.
    AllowedPattern: '16\.[0-9]+'
  DbStorageGiB:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 1000
  ProtectDatabase:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false through a reviewed stack update only when preparing final teardown.
  CreateSecondAlb:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [3, 5, 7, 14, 30]
  JenkinsAmiId:
    Type: String
    Default: ''
    Description: Optional prebuilt x86_64 Jenkins controller AMI with SSM Agent. Blank uses an existing Jenkins service.
    AllowedPattern: '(^$|ami-[a-f0-9]+)'
  JenkinsInstanceType:
    Type: String
    Default: m6i.xlarge
    AllowedValues: [m6i.large, m6i.xlarge, m6i.2xlarge]

Conditions:
  SecondAlb: !Equals [!Ref CreateSecondAlb, 'true']
  JenkinsHost: !Not [!Equals [!Ref JenkinsAmiId, '']]
  DatabaseProtected: !Equals [!Ref ProtectDatabase, 'true']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: !Ref PlatformName}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway}
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 2, 8]]
      MapPublicIpOnLaunch: false
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 2, 8]]
      MapPublicIpOnLaunch: false
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 3, 13]]
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 3, 13]]
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: !Ref PublicRoutes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicA, RouteTableId: !Ref PublicRoutes}
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicB, RouteTableId: !Ref PublicRoutes}
  NatAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: {Domain: vpc}
  Nat:
    Type: AWS::EC2::NatGateway
    Properties: {AllocationId: !GetAtt NatAddress.AllocationId, SubnetId: !Ref PublicA}
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref PrivateRoutes, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat}
  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateA, RouteTableId: !Ref PrivateRoutes}
  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateB, RouteTableId: !Ref PrivateRoutes}
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRoutes]
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS lab ingress
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from EKS nodes and the optional operations host
      VpcId: !Ref Vpc
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: eks.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy']
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
  ClusterLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/eks/${PlatformName}/cluster
      RetentionInDays: !Ref LogRetentionDays
  Cluster:
    Type: AWS::EKS::Cluster
    DependsOn: ClusterLogs
    Properties:
      Name: !Ref PlatformName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig: {AuthenticationMode: API, BootstrapClusterCreatorAdminPermissions: false}
      UpgradePolicy: {SupportType: STANDARD}
      ResourcesVpcConfig:
        SubnetIds: [!Ref PrivateA, !Ref PrivateB]
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs: [!Ref ApiAccessCidr]
      Logging:
        ClusterLogging:
          EnabledTypes: [{Type: api}, {Type: audit}, {Type: authenticator}]
  AdminAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref PlatformAdminRoleArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: !Sub arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope: {Type: cluster}
  NodeTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions: {HttpEndpoint: enabled, HttpTokens: required, HttpPutResponseHopLimit: 1}
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {Encrypted: true, VolumeSize: 40, VolumeType: gp3, DeleteOnTermination: true}
  Workers:
    Type: AWS::EKS::Nodegroup
    DependsOn: [PrivateDefaultRoute, PrivateAssociationA, PrivateAssociationB, VpcCni]
    Properties:
      ClusterName: !Ref Cluster
      NodeRole: !GetAtt NodeRole.Arn
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      InstanceTypes: [!Ref WorkerInstanceType]
      Subnets: [!Ref PrivateA, !Ref PrivateB]
      LaunchTemplate: {Id: !Ref NodeTemplate, Version: !GetAtt NodeTemplate.LatestVersionNumber}
      ScalingConfig: {MinSize: 2, DesiredSize: !Ref WorkerCount, MaxSize: 30}
      UpdateConfig: {MaxUnavailable: 1}
      Labels: {workload: applications}
  CniRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: ['sts:AssumeRole', 'sts:TagSession']
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy']
  VpcCni:
    Type: AWS::EKS::Addon
    DependsOn: PodIdentityAgent
    Properties:
      ClusterName: !Ref Cluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE
      ConfigurationValues: '{"enableNetworkPolicy":"true","env":{"ENABLE_PREFIX_DELEGATION":"true","WARM_PREFIX_TARGET":"1"}}'
      PodIdentityAssociations:
        - {RoleArn: !GetAtt CniRole.Arn, ServiceAccount: aws-node}
  PodIdentityAgent:
    Type: AWS::EKS::Addon
    Properties: {ClusterName: !Ref Cluster, AddonName: eks-pod-identity-agent, ResolveConflicts: OVERWRITE}
  CoreDns:
    Type: AWS::EKS::Addon
    DependsOn: Workers
    Properties: {ClusterName: !Ref Cluster, AddonName: coredns, ResolveConflicts: OVERWRITE}
  KubeProxy:
    Type: AWS::EKS::Addon
    Properties: {ClusterName: !Ref Cluster, AddonName: kube-proxy, ResolveConflicts: OVERWRITE}
  EbsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: ['sts:AssumeRole', 'sts:TagSession']
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy']
  EbsAddon:
    Type: AWS::EKS::Addon
    DependsOn: [Workers, PodIdentityAgent]
    Properties:
      ClusterName: !Ref Cluster
      AddonName: aws-ebs-csi-driver
      ResolveConflicts: OVERWRITE
      PodIdentityAssociations:
        - {RoleArn: !GetAtt EbsRole.Arn, ServiceAccount: ebs-csi-controller-sa}
  TargetBindingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: ['sts:AssumeRole', 'sts:TagSession']
      Policies:
        - PolicyName: BindExistingTargets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['ec2:Describe*', 'elasticloadbalancing:Describe*']
                Resource: '*'
              - Effect: Allow
                Action: ['elasticloadbalancing:RegisterTargets', 'elasticloadbalancing:DeregisterTargets']
                Resource: !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/*/*
                Condition:
                  StringEquals: {'aws:ResourceTag/Platform': !Ref PlatformName}
  TargetBindingIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: !Ref Cluster
      Namespace: kube-system
      ServiceAccount: aws-load-balancer-controller
      RoleArn: !GetAtt TargetBindingRole.Arn
  LogWriterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: ['sts:AssumeRole', 'sts:TagSession']
      Policies:
        - PolicyName: WriteLabLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents', 'logs:DescribeLogStreams']
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/fidelity/${PlatformName}/*:*
  LogWriterIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: !Ref Cluster
      Namespace: amazon-cloudwatch
      ServiceAccount: fluent-bit
      RoleArn: !GetAtt LogWriterRole.Arn
  DbNodeIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt Cluster.ClusterSecurityGroupId
  AlbNodeIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt Cluster.ClusterSecurityGroupId
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
  DbSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private training database subnets
      SubnetIds: [!Ref PrivateA, !Ref PrivateB]
  Database:
    Type: AWS::RDS::DBInstance
    DependsOn: DatabaseLogs
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceIdentifier: !Sub ${PlatformName}-postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbStorageGiB
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      DBSubnetGroupName: !Ref DbSubnets
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      MasterUsername: platform_admin
      ManageMasterUserPassword: true
      BackupRetentionPeriod: 1
      DeletionProtection: !If [DatabaseProtected, true, false]
      EnableCloudwatchLogsExports: [postgresql]
      Tags: [{Key: Platform, Value: !Ref PlatformName}]
  DatabaseLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/rds/instance/${PlatformName}-postgres/postgresql
      RetentionInDays: !Ref LogRetentionDays
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub '*.${BaseDomain}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - {DomainName: !Sub '*.${BaseDomain}', HostedZoneId: !Ref HostedZoneId}
  AlbA:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicA, !Ref PublicB]
      SecurityGroups: [!Ref AlbSecurityGroup]
  ListenerA:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AlbA
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref Certificate}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '404', ContentType: text/plain, MessageBody: Unknown lab environment}
  AlbB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: SecondAlb
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicA, !Ref PublicB]
      SecurityGroups: [!Ref AlbSecurityGroup]
  ListenerB:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: SecondAlb
    Properties:
      LoadBalancerArn: !Ref AlbB
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref Certificate}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '404', ContentType: text/plain, MessageBody: Unknown lab environment}
  JenkinsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: JenkinsHost
    Properties:
      GroupDescription: Private Jenkins controller accessed through SSM port forwarding
      VpcId: !Ref Vpc
  JenkinsRole:
    Type: AWS::IAM::Role
    Condition: JenkinsHost
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
  JenkinsProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: JenkinsHost
    Properties: {Roles: [!Ref JenkinsRole]}
  Jenkins:
    Type: AWS::EC2::Instance
    Condition: JenkinsHost
    DependsOn: PrivateDefaultRoute
    Properties:
      ImageId: !Ref JenkinsAmiId
      InstanceType: !Ref JenkinsInstanceType
      SubnetId: !Ref PrivateA
      SecurityGroupIds: [!Ref JenkinsSecurityGroup]
      IamInstanceProfile: !Ref JenkinsProfile
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 1}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {Encrypted: true, VolumeSize: 80, VolumeType: gp3, DeleteOnTermination: false}
      Tags: [{Key: Name, Value: !Sub '${PlatformName}-jenkins'}]
  JenkinsDbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: JenkinsHost
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref JenkinsSecurityGroup

Outputs:
  PlatformName: {Value: !Ref PlatformName}
  ClusterName: {Value: !Ref Cluster}
  VpcId: {Value: !Ref Vpc}
  VpcCidr: {Value: !Ref VpcCidr}
  PrivateSubnetIds: {Value: !Join [',', [!Ref PrivateA, !Ref PrivateB]]}
  PublicSubnetCidrA: {Value: !Select [0, !Cidr [!Ref VpcCidr, 2, 8]]}
  PublicSubnetCidrB: {Value: !Select [1, !Cidr [!Ref VpcCidr, 2, 8]]}
  DatabaseHost: {Value: !GetAtt Database.Endpoint.Address}
  DatabaseAdminSecretArn: {Value: !GetAtt Database.MasterUserSecret.SecretArn}
  DatabaseIdentifier: {Value: !Ref Database}
  HostedZoneId: {Value: !Ref HostedZoneId}
  BaseDomain: {Value: !Ref BaseDomain}
  ListenerArnA: {Value: !Ref ListenerA}
  AlbDnsA: {Value: !GetAtt AlbA.DNSName}
  AlbZoneA: {Value: !GetAtt AlbA.CanonicalHostedZoneID}
  ListenerArnB: {Condition: SecondAlb, Value: !Ref ListenerB}
  AlbDnsB: {Condition: SecondAlb, Value: !GetAtt AlbB.DNSName}
  AlbZoneB: {Condition: SecondAlb, Value: !GetAtt AlbB.CanonicalHostedZoneID}
  JenkinsInstanceId: {Condition: JenkinsHost, Value: !Ref Jenkins}
  JenkinsRoleArn: {Condition: JenkinsHost, Value: !GetAtt JenkinsRole.Arn}
