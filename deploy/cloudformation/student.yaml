AWSTemplateFormatVersion: '2010-09-09'
Description: One group or individual environment on the shared Fidelity platform. Provision through the trusted platform job.

Parameters:
  PlatformName:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]{2,24}'
  ClusterName: {Type: String}
  EnvironmentId:
    Type: String
    Description: Stable group or student identifier, for example g001 or s001. Do not rename an existing environment.
    AllowedPattern: '[a-z][a-z0-9]{2,15}'
  JenkinsAgentRoleArn:
    Type: String
    Description: Existing role for this group's isolated Jenkins agent. Never use a role shared by untrusted group jobs.
    AllowedPattern: 'arn:aws:iam::[0-9]{12}:role/.+'
  DatabaseHost: {Type: String}
  VpcId: {Type: AWS::EC2::VPC::Id}
  HostedZoneId: {Type: AWS::Route53::HostedZone::Id}
  BaseDomain: {Type: String}
  ListenerArn:
    Type: String
    Description: Shared foundation ListenerArnA or ListenerArnB.
  AlbDnsName: {Type: String}
  AlbHostedZoneId: {Type: String}
  ListenerSlot:
    Type: Number
    MinValue: 1
    MaxValue: 30
    Description: Unique slot on this listener. Three priorities and target groups per environment.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [3, 5, 7, 14, 30]
  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_200 includes India. PriceClass_100 is suitable for US and Europe.

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Group database owner credentials. Database provisioning runs separately inside the VPC.
      Name: !Sub ${PlatformName}/${EnvironmentId}/database
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"etp_${EnvironmentId}","database":"etp_${EnvironmentId}","host":"${DatabaseHost}","port":5432}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags: [{Key: Platform, Value: !Ref PlatformName}, {Key: Environment, Value: !Ref EnvironmentId}]
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${PlatformName}/${EnvironmentId}/jwt
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: JWT_SECRET
        PasswordLength: 64
        ExcludePunctuation: true
  UiBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: RemoveOldVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 7}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
      Tags: [{Key: Platform, Value: !Ref PlatformName}, {Key: Environment, Value: !Ref EnvironmentId}]
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SpaRouting:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-spa
      AutoPublish: true
      FunctionConfig: {Comment: Angular deep links, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var segment = request.uri.substring(request.uri.lastIndexOf('/') + 1);
          if (segment.indexOf('.') === -1) request.uri = '/index.html';
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: !Ref CloudFrontPriceClass
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: private-s3
            DomainName: !GetAtt UiBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: private-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Minimum TTL is zero so index.html's no-cache header is respected.
          CachePolicyId: !Ref UiCachePolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - {EventType: viewer-request, FunctionARN: !GetAtt SpaRouting.FunctionARN}
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
      Tags: [{Key: Platform, Value: !Ref PlatformName}, {Key: Environment, Value: !Ref EnvironmentId}]
  UiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-ui
        MinTTL: 0
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${UiBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt UiBucket.Arn, !Sub '${UiBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': false}}
  ApplicationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /fidelity/${PlatformName}/etp-${EnvironmentId}
      RetentionInDays: !Ref LogRetentionDays
  ApiTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /actuator/health
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '15'}]
      Tags: [{Key: Platform, Value: !Ref PlatformName}]
  AuthTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /docs/json
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '15'}]
      Tags: [{Key: Platform, Value: !Ref PlatformName}]
  AnalyticsTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '15'}]
      Tags: [{Key: Platform, Value: !Ref PlatformName}]
  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ListenerArn
      Priority: !Sub '${ListenerSlot}1'
      Conditions: [{Field: host-header, Values: [!Sub 'api-${EnvironmentId}.${BaseDomain}']}]
      Actions: [{Type: forward, TargetGroupArn: !Ref ApiTargets}]
  AuthRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ListenerArn
      Priority: !Sub '${ListenerSlot}2'
      Conditions: [{Field: host-header, Values: [!Sub 'auth-${EnvironmentId}.${BaseDomain}']}]
      Actions: [{Type: forward, TargetGroupArn: !Ref AuthTargets}]
  AnalyticsRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ListenerArn
      Priority: !Sub '${ListenerSlot}3'
      Conditions:
        - {Field: host-header, Values: [!Sub 'report-${EnvironmentId}.${BaseDomain}']}
        - {Field: path-pattern, Values: ['/', '/index.html']}
      Actions: [{Type: forward, TargetGroupArn: !Ref AnalyticsTargets}]
  Dns:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Sub api-${EnvironmentId}.${BaseDomain}
          Type: A
          AliasTarget: {DNSName: !Ref AlbDnsName, HostedZoneId: !Ref AlbHostedZoneId, EvaluateTargetHealth: false}
        - Name: !Sub auth-${EnvironmentId}.${BaseDomain}
          Type: A
          AliasTarget: {DNSName: !Ref AlbDnsName, HostedZoneId: !Ref AlbHostedZoneId, EvaluateTargetHealth: false}
        - Name: !Sub report-${EnvironmentId}.${BaseDomain}
          Type: A
          AliasTarget: {DNSName: !Ref AlbDnsName, HostedZoneId: !Ref AlbHostedZoneId, EvaluateTargetHealth: false}
  ApiErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API target returned at least five HTTP 5xx responses in five minutes. Visible in CloudWatch; attach notifications separately.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: TargetGroup, Value: !GetAtt ApiTargets.TargetGroupFullName}
        - Name: LoadBalancer
          Value: !Join ['/', [!Select [1, !Split ['/', !Ref ListenerArn]], !Select [2, !Split ['/', !Ref ListenerArn]], !Select [3, !Split ['/', !Ref ListenerArn]]]]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {AWS: !Ref JenkinsAgentRoleArn}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReleaseThisEnvironment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'eks:DescribeCluster', Resource: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'}
              - {Effect: Allow, Action: 's3:ListBucket', Resource: !GetAtt UiBucket.Arn}
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject']
                Resource: !Sub ${UiBucket.Arn}/*
              - Effect: Allow
                Action: ['cloudfront:CreateInvalidation', 'cloudfront:GetInvalidation']
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
              - Effect: Allow
                Action: ['cloudformation:DescribeStacks', 'cloudformation:DescribeStackEvents']
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action: ['logs:FilterLogEvents', 'logs:GetLogEvents', 'logs:DescribeLogStreams']
                Resource: !GetAtt ApplicationLogs.Arn
  ReleaseAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref ClusterName
      PrincipalArn: !GetAtt ReleaseRole.Arn
      Type: STANDARD
      KubernetesGroups: [!Sub 'etp:${EnvironmentId}:deploy']

Outputs:
  EnvironmentId: {Value: !Ref EnvironmentId}
  Namespace: {Value: !Sub 'etp-${EnvironmentId}'}
  PlatformName: {Value: !Ref PlatformName}
  ClusterName: {Value: !Ref ClusterName}
  DatabaseHost: {Value: !Ref DatabaseHost}
  DatabaseSecretArn: {Value: !Ref DatabaseSecret}
  JwtSecretArn: {Value: !Ref JwtSecret}
  BucketName: {Value: !Ref UiBucket}
  DistributionId: {Value: !Ref Distribution}
  FrontendUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
  ApiUrl: {Value: !Sub 'https://api-${EnvironmentId}.${BaseDomain}'}
  AuthUrl: {Value: !Sub 'https://auth-${EnvironmentId}.${BaseDomain}'}
  AnalyticsUrl: {Value: !Sub 'https://report-${EnvironmentId}.${BaseDomain}'}
  ApiTargetGroupArn: {Value: !Ref ApiTargets}
  AuthTargetGroupArn: {Value: !Ref AuthTargets}
  AnalyticsTargetGroupArn: {Value: !Ref AnalyticsTargets}
  ReleaseRoleArn: {Value: !GetAtt ReleaseRole.Arn}
  LogGroupName: {Value: !Ref ApplicationLogs}
