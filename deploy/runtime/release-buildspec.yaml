version: 0.2
phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: '22'
      python: '3.12'
    commands:
      - python -m pip install -r runtime/requirements.txt
      - python runtime/install_tools.py
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --storage-driver=overlay2 > /tmp/docker.log 2>&1 &
      - timeout 60 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
  build:
    commands:
      - python runtime/build.py
